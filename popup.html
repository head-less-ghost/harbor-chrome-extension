<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor download helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <header>
        <div class="brand">
          <img src="icons/icon48.png" width="32" height="32" alt="" />
          <div>
            <h1>Harbor download helper</h1>
            <span class="tag">Download Manager</span>
          </div>
        </div>
        <button
          id="options"
          class="icon-btn"
          title="Settings"
          aria-label="Settings"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </header>

      <div class="field">
        <input
          id="url"
          type="url"
          placeholder="Paste a download URL…"
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <div class="actions">
        <button id="send" class="btn primary">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v12" />
            <path d="M7 10l5 5 5-5" />
            <path d="M5 19h14" />
          </svg>
          Download with Harbor
        </button>
        <button id="current" class="btn ghost">Use current tab</button>
      </div>

      <div id="status" role="status"></div>

      <button id="test" class="link-btn" type="button">
        Test native helper
      </button>

      <div class="divider"></div>

      <label class="toggle-row" for="intercept">
        <div class="toggle-text">
          <strong>Auto-intercept</strong>
          <span>Send Chrome downloads to Harbor</span>
        </div>
        <div class="switch">
          <input type="checkbox" id="intercept" />
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
